<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./stylePanel.css">
    <title>Panel</title>
</head>

<body>
    <div class="modal-container" id="delete-modal">
        <div class="modal-content">
            <h1 class="modal-title">Are You Sure?</h1>
            <div class="btn-groups">
                <button class="unaccept-btn" onclick=closeDeleteModal()>No</button>
                <button class="accept-btn" onclick=removeUser()>Yes</button>
            </div>
        </div>
    </div>

    <div class="modal-container" id="edit-modal">
        <div class="modal-content">
            <h1>Enter Information of User</h1>
            <form action="" class="edit-user-form">
                <div class="input-field">
                    <input type="text" name="" id="firstName" placeholder="firstName" spellcheck="false">
                </div>
                <div class="input-field">
                    <input type="text" name="" id="lastName" placeholder="LastName" spellcheck="false">
                </div>
                <div class="input-field">
                    <input type="text" name="" id="username" placeholder="username" spellcheck="false">
                </div>
                <div class="input-field">
                    <input type="password" name="" id="password" placeholder="password" spellcheck="false">
                </div>

                <button type="submit" class="accept-btn" id="edit-user">Submit</button>
            </form>
        </div>
    </div>

    <h1 class="user-title">Registered Users</h1>
    <div id="wrap-users"> </div>
    <script src="js/users.js"></script>
</body>

</html>
